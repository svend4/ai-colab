name: Bulk-Deletion Guard (D-026)

# Серверный энфорсмент недеструктивной политики (D-026): массовое удаление
# файлов/истории на push/PR в main проверяется здесь. `git commit --no-verify`
# обходит только ЛОКАЛЬНЫЕ хуки — против этой CI-проверки он бессилен.
# Локальный аналог: tools/bulk_guard.py (pre-commit) + tools/commit.py (обёртка).
#
# Одобрение массового удаления — только человек: job `mass-delete-approval` ждёт
# ревью в GitHub Environment `mass-delete-approval` (required reviewers). Токены в
# сообщениях коммитов и метки на PR не принимаются (D-026 П-4: явное согласие человека).

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  bulk-guard:
    runs-on: ubuntu-latest
    outputs:
      mass_delete: ${{ steps.range.outputs.mass_delete }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # нужна полная история для диапазона

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Проверка массового удаления в диапазоне (D-026)
        id: range
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          fi
          # Новая ветка / отсутствующая база → сравнить с первым родителем HEAD.
          if [ -z "$BASE" ] || ! git rev-parse --verify "${BASE}^{commit}" >/dev/null 2>&1; then
            BASE=$(git rev-parse "${HEAD}~1" 2>/dev/null || echo "")
          fi
          if [ -z "$BASE" ]; then
            echo "Нет базы для сравнения (первый коммит) — пропускаю."
            echo "mass_delete=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Диапазон: ${BASE}..${HEAD}"
          DEL_FILES=$(git diff --diff-filter=D --name-only "$BASE" "$HEAD" | grep -c . || true)
          DEL_LINES=$(git diff "$BASE" "$HEAD" --numstat | awk '{s+=$2} END {print s+0}')
          echo "Удалено файлов: ${DEL_FILES}, строк: ${DEL_LINES}"
          # Пороги согласованы с локальным bulk_guard / dir_health.
          if [ "${DEL_FILES}" -gt 20 ] || [ "${DEL_LINES}" -gt 500 ]; then
            echo "mass_delete=true" >> "$GITHUB_OUTPUT"
            echo "::warning::D-026: массовое удаление (${DEL_FILES} файлов / ${DEL_LINES} строк). Нужно одобрение человека: job mass-delete-approval ждёт ревью в Environment."
            echo "Недеструктивная политика: помечай устаревшее status: closed/deprecated (reconcile), не удаляй."
          else
            echo "mass_delete=false" >> "$GITHUB_OUTPUT"
            echo "OK: массового удаления нет."
          fi

      - name: Снимок конвейера (D-011, артефакты gitignored)
        shell: bash
        env:
          PYTHONUTF8: "1"
        run: |
          # PIPELINE.md и logs/pipeline.json не коммитятся, в чистом checkout их нет,
          # а validate.py (D-011) требует их наличия — создаём снимок до проверки канона.
          python tools/pipeline.py snapshot

      - name: Целостность канона (validate.py ERROR=0)
        shell: bash
        env:
          PYTHONUTF8: "1"
        run: |
          python -m pip install --upgrade pip >/dev/null
          if [ -f requirements.txt ]; then pip install -r requirements.txt >/dev/null 2>&1 || true; fi
          python tools/validate.py

      - name: Свежесть навигации (generate --check)
        shell: bash
        env:
          PYTHONUTF8: "1"
        run: |
          # Полная сверка всё-дерево-нав переносится сюда из pre-commit (облегчение хука,
          # docs/pre-commit-lightening-proposal-2026-07-07.md). --no-verify это не обходит.
          python tools/generate.py --check

  mass-delete-approval:
    needs: bulk-guard
    if: needs.bulk-guard.outputs.mass_delete == 'true'
    runs-on: ubuntu-latest
    # Required reviewers настраивает человек: Settings → Environments → mass-delete-approval.
    # Пока правило не задано, GitHub пропускает этот job без ревью, поэтому не сливать до настройки.
    environment: mass-delete-approval
    steps:
      - name: Одобрение массового удаления (ревью человека)
        shell: bash
        run: |
          echo "Массовое удаление одобрено через Environment mass-delete-approval (ревью человека)."
